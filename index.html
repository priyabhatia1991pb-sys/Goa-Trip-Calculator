let data=JSON.parse(localStorage.getItem("goaTrip")||"[]");
function save(){localStorage.setItem("goaTrip",JSON.stringify(data));render();}
function add(){let p=payer.value,d=desc.value,a=parseFloat(amt.value);if(!d||!a)return;data.push({p,d,a});desc.value="";amt.value="";save();}
function render(){rows.innerHTML="";let t=0,s={Priya:0,Emy:0,Neha:0};data.forEach(e=>{t+=e.a;s[e.p]+=e.a;rows.innerHTML+=`<tr><td>${e.p}</td><td>${e.d}</td><td>₹${e.a.toFixed(2)}</td></tr>`});let share=t/3,res=[];for(let k in s){let diff=s[k]-share;res.push(`${k}: ${diff>=0?"gets back":"owes"} ₹${Math.abs(diff).toFixed(2)}`)}summary.innerHTML=`Total: ₹${t.toFixed(2)}<br>Each should pay: ₹${share.toFixed(2)}<br><br>${res.join("<br>")}`;}
function resetTrip(){if(confirm("Reset?")){data=[];save();}}
render();
